[build-system]
requires = [
    "setuptools>=64",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name="ducktools-pytui"
description="A TUI for managing Python runtimes and installs"
authors = [
  { name="David C Ellis" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "ducktools-classbuilder>=0.15.3",
    "ducktools-pythonfinder>=0.11.0",
    "ducktools-lazyimporter>=0.8.4",
    "textual>=8.2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ['version']

[project.urls]
"Homepage" = "https://github.com/davidcellis/ducktools-pytui"

[project.scripts]
"pytui" = "ducktools.pytui.__main__:main"
"ducktools-pytui" = "ducktools.pytui.__main__:main"  # For uvx invocations

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4",
    "mypy>=2.4",
    "pytest-rerunfailures>=16.7",
    "textual-dev>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/ducktools/pytui/_version.py"
version_file_template = """
__version__ = "{version}"
__version_tuple__ = {version_tuple}
"""

[tool.pytest.ini_options]
addopts= "--cov=src/ --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.pyright]
typeCheckingMode = "off"
ignore = ["*"]

[tool.ruff.lint]
ignore = [
    "E401",
]

[tool.mypy]
disable_error_code = ["import-untyped"]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.exclude-newer-package]
# Exclude other projects I own as they may contain early fixes
ducktools-classbuilder = false
ducktools-lazyimporter = false
ducktools-pythonfinder = false
reannotate = false
